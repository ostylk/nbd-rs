[workspace]
members = [
    "netlink-packet-nbd"
]

[package]
name = "nbd-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.33"
genetlink = "0.2.7"
netlink-packet-core = "0.8.1"
netlink-packet-generic = "0.4.0"
tokio = { version = "1.53.1", features = ["full"] }
netlink-packet-nbd = { path = "./netlink-packet-nbd" }
bitfields = "3.0.0"
netlink-sys = { version = "0.8.8", features = ["tokio", "tokio_socket"] }
thiserror = "2.0.19"
clap = { version = "4.6.5", features = ["derive"] }
